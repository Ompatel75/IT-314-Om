services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-health-backend:latest
    container_name: ai_health_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # Reads environment variables (including MongoDB Atlas MONGO_URI) from .env
      - path: .env
        required: true
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MONGO_DATABASE=${MONGO_DATABASE:-project_health}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      # Mount Backend directory for real-time live reload during development
      - ./Backend:/app/Backend
    command: uvicorn Backend.main:app --host 0.0.0.0 --port 8000 --reload
